<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos DOM</title>
    <style>
        #area {
            font: normal 20pt arial;
            background-color: green;
            color: white;
            width: 200px;
            height: 200px;
            line-height: 200px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="area">
        Interaja
    </div>
    <script>
        var evento = window.document.getElementById('area')
            evento.addEventListener('click', clicar)
            evento.addEventListener('mouseenter', entrar)
            evento.addEventListener('mouseout', saiu)

        function clicar() {
            var a = window.document.getElementById('area')
            a.innerText = 'Clicou!'
            a.style.background = 'red'
        }
        function entrar() {
            var b = window.document.getElementById('area')
            b.innerText = 'Entrou!'
        }
        function saiu() {
            var c = window.document.getElementById('area')
            c.innerText = 'Saiu!'
            c.style.background = 'green'
        }
    </script>
</body>
</html>
