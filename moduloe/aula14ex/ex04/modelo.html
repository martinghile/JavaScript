<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Exercício</title>
    <link rel="stylesheet" href="style.css">
</head>
<body onload="carregar()">
    <header>
        <h1>Tabuada</h1>
    </header>
    <section>
        <div id="insercao">
            <p><label for="txtnb">Número:</label> <input type="number" name="txtnb" id="txtnb">

        </div>
        <div id="tabuada">
          <p>
            <select name="tab" id="res" size="10">
                <option value="teste">Digite um número acima</option>
            </select>
          </p>
        </div>
    </section>
    <footer>
        <p>&copy; CursoemVídeo</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
